<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon Akelia (16 octobre 2026). Carré orange action-500 (#f0920f),
       coins arrondis ; losange bleu nuit nuit-900 (#1d2b36), centré, 20px
       de diagonale sur 32 (62 % de la largeur). Bleu nuit plutôt que blanc :
       6,1:1 sur l'orange, contre 2,2:1 pour le blanc. Formes pleines, sans
       détail : lisible à 16px. Version Apple : apple-touch-icon.png. -->
  <rect width="32" height="32" rx="6" fill="#f0920f"/>
  <path d="M16 6 L26 16 L16 26 L6 16 Z" fill="#1d2b36" stroke="#1d2b36" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
